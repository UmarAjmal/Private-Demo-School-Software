<!DOCTYPE html>
<html lang="ur">

<head>
  <meta charset="UTF-8">
  <title>Marks Sheet - Page 1 (With Header)</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 8mm;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Times New Roman", Georgia, serif;
      margin: 0;
      color: #000;
      background: #e9e9e9;
    }

    .page-card {
      background: #fff;
      padding: 14px 18px 18px;
      border-radius: 10px;
    }

    .school-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-bottom: 3px double #000;
      padding-bottom: 8px;
      margin-bottom: 4px;
    }

    .school-header img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      flex-shrink: 0;
      border: 3px solid #000;
    }

    .school-header img.logo-circle {
      border-radius: 50%;
    }

    .school-header img.logo-square {
      border-radius: 8px;
    }

    .school-header .titles {
      text-align: left;
      white-space: nowrap;
    }

    .school-header h1 {
      margin: 0;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: inline-block;
      color: #000;
    }

    .school-header .addr {
      font-size: 16px;
      margin-left: 10px;
      color: #333;
    }

    .sheet-title {
      text-align: center;
      font-weight: bold;
      font-size: 21px;
      margin: 12px 0 10px 0;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-line {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 30px;
      font-size: 17px;
      margin: 0 auto 14px;
      background: #f0f0f0;
      border: 1px solid #999;
      border-radius: 8px;
      padding: 8px 16px;
      max-width: 95%;
    }

    .meta-line .item {
      white-space: nowrap;
    }

    .meta-line .val {
      font-weight: bold;
      margin-left: 4px;
      color: #000;
      text-decoration: underline;
    }

    table.marks {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    table.marks th,
    table.marks td {
      border: 1.5px solid #000;
      text-align: center;
      padding: 7px 4px;
      font-size: 15px;
    }

    table.marks thead th {
      font-weight: bold;
      font-size: 13px;
      background: #e8e8e8;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      border: 1.5px solid #000;
      line-height: 1.2;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: break-word;
      vertical-align: middle;
    }

    table.marks thead th .max-marks {
      display: inline-block;
      font-weight: normal;
      font-size: 12px;
      color: #333;
      margin-top: 2px;
      text-transform: none;
    }

    table.marks td.name-col {
      text-align: left;
      padding-left: 10px;
    }

    table.marks th.name-col {
      text-align: center;
    }

    table.marks th.roll-col,
    table.marks td.roll-col {
      width: 34px;
    }

    table.marks th.name-col,
    table.marks td.name-col {
      width: 190px;
    }

    table.marks tr {
      height: 30px;
    }

    table.marks tbody tr:nth-child(even) {
      background: #f2f2f2;
    }

    table.marks td.roll-col {
      font-weight: bold;
      color: #000;
    }

    table.marks thead tr {
      border-bottom: 3px solid #000;
    }



    @media print {
      body {
        background: #fff;
      }

      .page-card {
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div id="sheet1"></div>

  <script>
    /* =====================================================================
       YAHAN APNA DATA / SETTINGS DAALEN
       ===================================================================== */
    const school = {
      logoUrl: "https://placehold.co/140x140/1e6fd9/ffffff?text=LOGO", // apna logo URL/path
      logoShape: "circle", // "circle" ya "square" — jo bhi chahiye likh dein
      name: "Falcon School System",
      address: "83/m Madina colony Vehari"
    };

    const classInfo = {
      className: "5th",
      section: "A",
      examTerm: "",
      year: "",
      totalMarks: "",
      classTeacher: ""   // system sa aane wala class teacher ka naam
    };

    // Har subject ka "name" aur us subject k "total" (max) marks.
    // 5 sa 10-11 tak subjects rakh saktay hain — jitni zaroorat ho.
    // Yahan 10 subjects ka example diya hai (Oral subjects samet) taake preview dikh sakay.
    const subjects = [
      { name: "English", total: 100 },
      { name: "English Oral", total: 50 },
      { name: "Urdu", total: 100 },
      { name: "Urdu Oral", total: 50 },
      { name: "Science", total: 100 },
      { name: "Math", total: 100 },
      { name: "S.ST", total: 100 },
      { name: "Islamiat", total: 50 },
      { name: "Al-Quran/Nazra", total: 50 },
      { name: "Computer", total: 50 }
    ];

    // Is page k 16 students (roll 1 sa 16). Khali chore to blank row ban jaye gi.
    const students = [
      // { roll: 1, name: "Ali Raza", marks: { "English": 45, "Urdu": 38 } }
    ];

    const ROWS = 16;
    /* ===================================================================== */

    function buildTableHead() {
      const subjectTh = subjects.map(s => `<th>${s.name}<br><span class="max-marks">${s.total}</span></th>`).join("");
      return `
    <tr>
      <th class="roll-col">Roll<br>No</th>
      <th class="name-col">Student Name</th>
      ${subjectTh}
      <th>Total<br>Marks</th>
      <th>Position</th>
    </tr>`;
    }

    function buildRow(roll, rowData) {
      const marksCells = subjects.map(s => `<td>${(rowData && rowData.marks && rowData.marks[s.name]) || ""}</td>`).join("");
      return `
    <tr>
      <td class="roll-col">${roll}</td>
      <td class="name-col">${rowData ? (rowData.name || "") : ""}</td>
      ${marksCells}
      <td></td>
      <td></td>
    </tr>`;
    }

    function render() {
      const byRoll = {};
      students.forEach(s => byRoll[s.roll] = s);

      let rowsHtml = "";
      for (let r = 1; r <= ROWS; r++) {
        rowsHtml += buildRow(r, byRoll[r]);
      }

      document.getElementById("sheet1").innerHTML = `
    <div class="page-card">
    <div class="school-header">
      <img src="${school.logoUrl}" alt="logo" class="${school.logoShape === 'square' ? 'logo-square' : 'logo-circle'}">
      <div class="titles">
        <h1>${school.name}</h1>
        <span class="addr">${school.address}</span>
      </div>
    </div>
    <div class="sheet-title">Detailed Marks Sheet of Obtained Marks in Exam.</div>
    <div class="meta-line">
      <span class="item">Class: <span class="val">${classInfo.className}</span></span>
      <span class="item">Section: <span class="val">${classInfo.section}</span></span>
      <span class="item">Exam Term: <span class="val">${classInfo.examTerm}</span></span>
      <span class="item">Year: <span class="val">${classInfo.year}</span></span>
      <span class="item">Total Marks: <span class="val">${classInfo.totalMarks}</span></span>
      <span class="item">Class Teacher: <span class="val">${classInfo.classTeacher}</span></span>
    </div>
    <table class="marks">
      <thead>${buildTableHead()}</thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>`;
    }

    render();
  </script>

</body>

</html>

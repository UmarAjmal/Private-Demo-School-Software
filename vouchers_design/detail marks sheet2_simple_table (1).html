<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Marks Sheet - Page 2 (Simple Table)</title>
<style>
  @page { size: A4 landscape; margin: 8mm; }
  * { box-sizing: border-box; }
  body { font-family: "Times New Roman", Georgia, serif; margin: 0; color: #000; background: #e9e9e9; }

  .page-card {
    background: #fff;
    padding: 14px 18px 18px;
    border-radius: 10px;
  }

  table.marks { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.marks th, table.marks td {
    border: 1.5px solid #000;
    text-align: center;
    padding: 7px 4px;
    font-size: 15px;
  }
  table.marks thead th {
    font-weight: bold;
    font-size: 13px;
    background: #e8e8e8;
    color: #000;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    border: 1.5px solid #000;
    line-height: 1.2;
    white-space: normal;
    word-break: break-word;
    overflow-wrap: break-word;
    vertical-align: middle;
  }
  table.marks thead th .max-marks {
    display: inline-block;
    font-weight: normal;
    font-size: 12px;
    color: #333;
    margin-top: 2px;
    text-transform: none;
  }
  table.marks td.name-col { text-align: left; padding-left: 10px; }
  table.marks th.name-col { text-align: center; }
  table.marks th.roll-col, table.marks td.roll-col { width: 34px; }
  table.marks th.name-col, table.marks td.name-col { width: 190px; }
  table.marks tr { height: 30px; }
  table.marks tbody tr:nth-child(even) { background: #f2f2f2; }
  table.marks td.roll-col { font-weight: bold; color: #000; }
  table.marks thead tr { border-bottom: 3px solid #000; }


  @media print {
    body { background: #fff; }
    .page-card { border-radius: 0; }
  }
</style>
</head>
<body>

<div id="sheet2"></div>

<script>
/* =====================================================================
   YAHAN APNA DATA / SETTINGS DAALEN
   ===================================================================== */

// Sheet 1 walay hi subjects yahan bhi daalen (same order, same total marks)
const subjects = [
  { name: "English",         total: 100 },
  { name: "English Oral",    total: 50  },
  { name: "Urdu",            total: 100 },
  { name: "Urdu Oral",       total: 50  },
  { name: "Science",         total: 100 },
  { name: "Math",            total: 100 },
  { name: "S.ST",            total: 100 },
  { name: "Islamiat",        total: 50  },
  { name: "Al-Quran/Nazra",  total: 50  },
  { name: "Computer",        total: 50  }
];

// Is page k 16 students (roll 17 sa 32). Khali chore to blank row ban jaye gi.
const students = [
  // { roll: 17, name: "Sara Khan", marks: { "English": 40, "Urdu": 35 } }
];

const START_ROLL = 17; // pehla page (16 students) k baad agla roll number
const ROWS = 16;
/* ===================================================================== */

function buildTableHead() {
  const subjectTh = subjects.map(s => `<th>${s.name}<br><span class="max-marks">${s.total}</span></th>`).join("");
  return `
    <tr>
      <th class="roll-col">Roll<br>No</th>
      <th class="name-col">Student Name</th>
      ${subjectTh}
      <th>Total<br>Marks</th>
      <th>Position</th>
    </tr>`;
}

function buildRow(roll, rowData) {
  const marksCells = subjects.map(s => `<td>${(rowData && rowData.marks && rowData.marks[s.name]) || ""}</td>`).join("");
  return `
    <tr>
      <td class="roll-col">${roll}</td>
      <td class="name-col">${rowData ? (rowData.name || "") : ""}</td>
      ${marksCells}
      <td></td>
      <td></td>
    </tr>`;
}

function render() {
  const byRoll = {};
  students.forEach(s => byRoll[s.roll] = s);

  let rowsHtml = "";
  for (let i = 0; i < ROWS; i++) {
    const roll = START_ROLL + i;
    rowsHtml += buildRow(roll, byRoll[roll]);
  }

  document.getElementById("sheet2").innerHTML = `
    <div class="page-card">
    <table class="marks">
      <thead>${buildTableHead()}</thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>`;
}

render();
</script>

</body>
</html>

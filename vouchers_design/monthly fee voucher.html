<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voucher Sheet</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    html, body {
      margin: 0;
      padding: 0;
      width: 297mm;
      min-height: 210mm;
      box-sizing: border-box;
      font-family: 'Times New Roman', Times, serif;
      color: #000;
    }
    body { padding: 8mm; }
    .page {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5mm;
      width: 100%;
      min-height: 100%;
      box-sizing: border-box;
    }
    .cut-separator {
      position: relative;
      width: 0;
      align-self: stretch;
      border-left: 1.2pt dashed #555;
      margin: 0 1mm;
    }
    .cut-separator::before {
      content: "\2702";
      position: absolute;
      top: -4.2mm;
      left: 50%;
      transform: translateX(-50%) rotate(90deg);
      font-size: 8pt;
      color: #555;
      background: #fff;
      padding: 0 0.5mm;
    }

    /* Voucher frame: FIXED height so page always stays A4 landscape and
       all 3 voucher borders always line up on the same plane.
       Everything inside uses FIXED row sizes (no font-shrinking). A
       flex spacer (.filler) at the very end absorbs whatever height is
       left over. At worst case (9 students + 4 fee-heads + total +
       rules) the filler shrinks to ~0. At lighter cases it grows,
       which is exactly the "empty space" area. */
    .voucher {
      width: 92mm;
      height: 190mm;
      border: 1.5pt solid #000;
      outline: 0.5pt solid #000;
      outline-offset: 1.5pt;
      padding: 4mm 4mm;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      page-break-inside: avoid;
      break-inside: avoid;
      overflow: hidden;
    }
    .voucher-header {
      display: flex;
      align-items: center;
      gap: 3mm;
      flex: 0 0 auto;
    }
    .logo-placeholder {
      width: 24mm;
      height: 20mm;
      flex: 0 0 auto;
      border: 1pt solid #000;
      background: repeating-linear-gradient(
        45deg, #fff, #fff 3px, #e2e2e2 3px, #e2e2e2 4px
      );
    }
    .school-name {
      flex: 1 1 auto;
      font-size: 12.5pt;
      font-weight: bold;
      text-transform: uppercase;
      line-height: 1.15;
      text-align: left;
    }
    .school-address, .school-contact {
      font-size: 9.5pt;
      text-align: center;
      width: 100%;
      flex: 0 0 auto;
    }
    .school-address { margin-top: 1mm; }
    .school-contact { margin-top: 0.5mm; white-space: nowrap; }
    .divider { width: 100%; border-top: 1pt solid #000; margin: 1mm 0; flex: 0 0 auto; }
    .voucher-type {
      font-size: 12.5pt;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      margin: 0.3mm 0;
      flex: 0 0 auto;
    }
    .voucher-details {
      font-size: 10.5pt;
      margin-top: 1mm;
      white-space: nowrap;
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 0 0 auto;
    }
    .voucher-details .detail-group:first-child { text-align: left; }
    .voucher-details .detail-group:last-child { text-align: right; }
    .voucher-details span.number,
    .voucher-details span.family-id {
      font-size: 10.5pt;
      font-weight: bold;
      text-decoration: underline;
    }
    .voucher-date-line {
      font-size: 9.5pt;
      margin-top: 0.5mm;
      white-space: nowrap;
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 0 0 auto;
    }
    .voucher-date-line .detail-group:first-child { text-align: left; }
    .voucher-date-line .detail-group:last-child { text-align: right; }
    .voucher-date-line span.date-value {
      font-size: 9.5pt;
      font-weight: bold;
      text-decoration: underline;
    }

    /* ---- body section (student table + fee table + rules) fills
       the rest of the voucher; the .filler at the end takes whatever
       is left over. Row sizes here are FIXED (do not shrink). ---- */
    .voucher-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .student-details, .fee-desc {
      font-size: 11pt;
      font-weight: bold;
      margin-top: 1.5mm;
      border-bottom: 1pt solid #000;
      padding-bottom: 0.3mm;
      flex: 0 0 auto;
    }

    .students-table, .fee-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5mm;
      font-size: 11pt;
      table-layout: fixed;
      flex: 0 0 auto;
    }
    .students-table th, .students-table td,
    .fee-table th, .fee-table td {
      border: 1px solid #000;
      padding: 0.5mm 1mm;
      line-height: 1.15;
      height: 5.2mm;
      word-wrap: break-word;
      box-sizing: border-box;
      overflow: hidden;
    }
    .students-table th, .fee-table th {
      font-weight: bold;
      background-color: #e9e9e9;
      height: 5.2mm;
    }
    /* Only kicks in for a voucher that is near its MAX capacity (lots
       of students + lots of fee-heads together in the same voucher).
       Normal/typical vouchers always render at the full 11pt above;
       this fallback exists purely so the rare "almost full" voucher
       still fits inside the same fixed border without losing data. */
    .voucher.table-compact .students-table,
    .voucher.table-compact .fee-table {
      font-size: 9.8pt;
    }
    .voucher.table-compact .students-table th,
    .voucher.table-compact .students-table td,
    .voucher.table-compact .fee-table th,
    .voucher.table-compact .fee-table td {
      height: 4.5mm;
      padding: 0.35mm 1mm;
    }
    .students-table th:nth-child(1), .students-table td:nth-child(1) { width: 37%; }
    .students-table th:nth-child(2), .students-table td:nth-child(2) { width: 37%; }
    .students-table th:nth-child(3), .students-table td:nth-child(3) { width: 26%; }

    .fee-table th:nth-child(1), .fee-table td:nth-child(1) { width: 12%; text-align: center; }
    .fee-table th:nth-child(2), .fee-table td:nth-child(2) { width: 58%; }
    .fee-table th:nth-child(3), .fee-table td:nth-child(3) { width: 30%; text-align: center; }
    .fee-table td:not(:first-child):not(:last-child) { text-align: left; }
    .students-table td { text-align: center; }
    .fee-table .total-row td {
      font-weight: bold;
      background-color: #e9e9e9;
      border-top: 1.5pt solid #000;
    }

    .rules-box {
      flex: 0 0 auto;
      padding-top: 0.8mm;
      margin-top: 0.8mm;
      font-size: 8.8pt;
      line-height: 1.35;
      border-top: 1pt dashed #000;
    }
    .rules-box .rule-line { display: block; }

    /* absorbs leftover space; shrinks to ~0 at max capacity (9
       students + 4 fee-heads), grows when a voucher has fewer rows */
    .filler { flex: 1 1 auto; }
  </style>
</head>
<body>
  <div class="page" id="page"></div>

  <script>
    /* =========================================================
       DATA SECTION — software/backend yahan se data feed karega.
       Har voucher ke liye ek object: students array (1 se 9 tak)
       aur fees array (2 se 4 tak fee-heads, total apne aap ban jayega)
       ========================================================= */
    const vouchersData = [
      {
        voucherNo: "12345678",
        familyId: "XYZ001",
        issueDate: "01-Aug-2025",
        dueDate: "10-Aug-2025",
        students: [
          { name: "Ali Hassan", father: "Muhammad Akbar", cls: "5th (A)" },
          { name: "Bilal Ahmed", father: "Rashid Khan", cls: "5th (A)" },
          { name: "Sana Fatima", father: "Khalid Mehmood", cls: "3rd (B)" },
          { name: "Ayesha Noor", father: "Farooq Ahmed", cls: "3rd (B)" },
          { name: "Zain Ali", father: "Naveed Iqbal", cls: "6th (C)" },
          { name: "Hina Batool", father: "Saeed Anwar", cls: "6th (C)" },
          { name: "Umar Farooq", father: "Tariq Mehmood", cls: "2nd (A)" },
          { name: "Hassan Raza", father: "Imran Ali", cls: "4th (A)" },
          { name: "Maryam Zafar", father: "Zafar Iqbal", cls: "1st (B)" }
        ],
        fees: [
          { desc: "Monthly Fee", amount: "8000/-" },
          { desc: "Previous Dues", amount: "1500/-" },
          { desc: "Exam Fee", amount: "1000/-" },
          { desc: "Books Fee", amount: "2000/-" }
        ]
      },
      {
        voucherNo: "87654321",
        familyId: "XYZ002",
        issueDate: "01-Aug-2025",
        dueDate: "10-Aug-2025",
        students: [
          { name: "Kamran Yousaf", father: "Yousaf Iqbal", cls: "8th (A)" }
        ],
        fees: [
          { desc: "Monthly Fee", amount: "8000/-" },
          { desc: "Previous Dues", amount: "1200/-" }
        ]
      },
      {
        voucherNo: "11223344",
        familyId: "XYZ003",
        issueDate: "01-Aug-2025",
        dueDate: "10-Aug-2025",
        students: [
          { name: "", father: "", cls: "" },
          { name: "", father: "", cls: "" },
          { name: "", father: "", cls: "" }
        ],
        fees: [
          { desc: "Monthly Fee", amount: "8000/-" },
          { desc: "Previous Dues", amount: "500/-" },
          { desc: "Exam Fee", amount: "1000/-" }
        ]
      }
    ];

    const MIN_STUDENTS = 4;   // always show at least 4 student rows
    const MAX_STUDENTS = 9;   // extend beyond 4 up to 9 as students are added
    const MIN_FEES = 2;       // always show Monthly Fee + Previous Dues
    const MAX_FEES = 4;       // extend beyond base when extra fee-heads (Exam Fee, Books Fee, etc.) are added

    function calcTotal(fees) {
      let total = 0;
      fees.forEach(f => {
        const num = parseFloat(String(f.amount).replace(/[^0-9.]/g, "")) || 0;
        total += num;
      });
      return total.toLocaleString() + "/-";
    }

    function buildStudentsTable(students) {
      let rows = students.slice(0, MAX_STUDENTS);
      while (rows.length < MIN_STUDENTS) rows.push({ name: "", father: "", cls: "" });

      let rowsHtml = rows.map(s => `
          <tr>
            <td>${s.name || "&nbsp;"}</td>
            <td>${s.father || "&nbsp;"}</td>
            <td>${s.cls || "&nbsp;"}</td>
          </tr>`).join("");

      return `
        <div class="student-details">Students Details</div>
        <table class="students-table">
          <thead>
            <tr><th>Student Name</th><th>Father Name</th><th>Class (Sec)</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;
    }

    function buildFeeTable(fees) {
      // Base fee-heads (Monthly Fee, Previous Dues) always show, even if
      // caller passes fewer. Extra heads (Exam Fee, Books Fee, etc.) only
      // appear if actually present in the data, and the table extends
      // automatically up to MAX_FEES rows before Total.
      let rows = fees.slice(0, MAX_FEES);
      while (rows.length < MIN_FEES) rows.push({ desc: "", amount: "0/-" });

      let rowsHtml = rows.map((f, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${f.desc || "&nbsp;"}</td>
            <td>${f.amount || "0/-"}</td>
          </tr>`).join("");

      const totalRow = `
          <tr class="total-row">
            <td>${rows.length + 1}</td>
            <td>Total Amount</td>
            <td>${calcTotal(rows)}</td>
          </tr>`;

      return `
        <div class="fee-desc">Fee Details</div>
        <table class="fee-table">
          <thead>
            <tr><th>Sr.#</th><th>Fee Description</th><th>Amount</th></tr>
          </thead>
          <tbody>${rowsHtml}${totalRow}</tbody>
        </table>
        <div class="rules-box">
          <span class="rule-line">1. Fee must be paid before the due date.</span>
          <span class="rule-line">2. A fine/late fee will apply after the due date.</span>
          <span class="rule-line">3. Fee must be deposited only at the school-designated bank/counter.</span>
          <span class="rule-line">4. Fee once paid is non-refundable under any circumstances.</span>
        </div>`;
    }

    function buildVoucher(v) {
      // Full 11pt table text is used for the vast majority of vouchers.
      // Only when a voucher is close to BOTH maximums at once (lots of
      // students AND lots of fee-heads together) does it switch to a
      // slightly smaller table size, so that rare edge case still fits
      // inside the same fixed border instead of losing data.
      const studentCount = Math.max(MIN_STUDENTS, Math.min(v.students.length, MAX_STUDENTS));
      const feeCount = Math.max(MIN_FEES, Math.min(v.fees.length, MAX_FEES));
      const extraRows = (studentCount - MIN_STUDENTS) + (feeCount - MIN_FEES);
      const compactClass = extraRows >= 3 ? " table-compact" : "";

      return `
        <div class="voucher${compactClass}">
          <div class="voucher-header">
            <div class="logo-placeholder"></div>
            <div class="school-name">Falcon School System</div>
          </div>
          <div class="school-address">83/M Madina Colony Vehari</div>
          <div class="school-contact">0300-7730141 ; 0308-7696430 ; 067-3366383</div>
          <div class="divider"></div>
          <div class="voucher-type">Monthly Fee Voucher</div>
          <div class="divider"></div>
          <div class="voucher-details">
            <span class="detail-group">Voucher No: <span class="number">${v.voucherNo}</span></span>
            <span class="detail-group">Family ID: <span class="family-id">${v.familyId}</span></span>
          </div>
          <div class="voucher-date-line">
            <span class="detail-group">Issue date: <span class="date-value">${v.issueDate}</span></span>
            <span class="detail-group">Due date: <span class="date-value">${v.dueDate}</span></span>
          </div>
          <div class="voucher-body">
            ${buildStudentsTable(v.students)}
            ${buildFeeTable(v.fees)}
            <div class="filler"></div>
          </div>
        </div>`;
    }

    document.getElementById("page").innerHTML = vouchersData
      .map(buildVoucher)
      .join('<div class="cut-separator"></div>');
  </script>
</body>
</html>
